name: Java CI with Docker

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Debug - List files
      run: |
        echo "Current directory:"
        pwd
        ls -R

    # 🐳 Docker login
    - name: Login to DockerHub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build Customers Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/customers:${{ github.run_number }} -f docker/Dockerfile spring-petclinic-customers-service

    - name: Build Vets Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/vets:${{ github.run_number }} -f docker/Dockerfile spring-petclinic-vets-service

    - name: Build Visits Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/visits:${{ github.run_number }} -f docker/Dockerfile spring-petclinic-visits-service

    # 🐳 Push Docker image
    - name: Push Docker Image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/petclinic:${{ github.run_number }}